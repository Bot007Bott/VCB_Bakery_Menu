<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCB Bakery Menu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fdf6ee;
        --warm-white: #fffaf5;
        --brown-deep: #3d1f0d;
        --brown-mid: #7b3f1e;
        --brown-light: #c4845a;
        --peach: #f0bfa0;
        --peach-light: #faeада;
        --peach-pale: #fdf1e7;
        --gold: #c8923a;
        --text-dark: #2c1508;
        --text-mid: #6b3a22;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--cream);
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--text-dark);
        min-height: 100vh;
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        background: var(--warm-white);
        padding: 56px 48px 64px;
        position: relative;
      }

      /* Thin border frame */
      .page::before {
        content: "";
        position: absolute;
        inset: 16px;
        border: 1px solid var(--peach);
        pointer-events: none;
        z-index: 0;
        border-radius: 2px;
      }

      /* Corner ornaments */
      .corner {
        position: absolute;
        width: 32px;
        height: 32px;
        z-index: 1;
      }
      .corner svg {
        width: 100%;
        height: 100%;
      }
      .corner-tl {
        top: 10px;
        left: 10px;
      }
      .corner-tr {
        top: 10px;
        right: 10px;
        transform: scaleX(-1);
      }
      .corner-bl {
        bottom: 10px;
        left: 10px;
        transform: scaleY(-1);
      }
      .corner-br {
        bottom: 10px;
        right: 10px;
        transform: scale(-1);
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 36px;
        position: relative;
        z-index: 1;
      }

      .logo-img {
        width: 120px;
        height: auto;
        margin-bottom: 10px;
      }

      .bakery-name {
        font-family: "Playfair Display", serif;
        font-size: 40px;
        font-weight: 700;
        color: var(--brown-deep);
        letter-spacing: 1px;
        line-height: 1;
      }

      .tagline {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--brown-light);
        margin-top: 8px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px auto;
        max-width: 280px;
      }
      .divider-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          var(--peach),
          transparent
        );
      }
      .divider-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--brown-light);
      }

      .menu-title {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--brown-mid);
      }

      /* Table header */
      .price-header {
        display: grid;
        grid-template-columns: 120px 1fr 120px 120px;
        background: var(--brown-deep);
        border-radius: 8px 8px 0 0;
        padding: 16px 20px;
        position: relative;
        z-index: 1;
      }

      .price-header span {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #f5dfc8;
      }

      .price-header span:not(:first-child) {
        text-align: center;
      }

      /* Menu list */
      .menu-list {
        border: 1.5px solid var(--peach);
        border-top: none;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      .menu-item {
        display: grid;
        grid-template-columns: 120px 1fr 120px 120px;
        align-items: center;
        border-bottom: 1px solid #f0ddd0;
        transition:
          background 0.2s ease,
          border-left 0.2s ease;
        animation: fadeUp 0.45s ease both;
        border-left: 3px solid transparent;
      }

      .menu-item:last-child {
        border-bottom: none;
      }
      .menu-item:nth-child(odd) {
        background: var(--warm-white);
      }
      .menu-item:nth-child(even) {
        background: var(--peach-pale);
      }
      .menu-item:hover {
        background: #fde5cc;
        border-left-color: var(--brown-light);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .menu-item:nth-child(1) {
        animation-delay: 0.05s;
      }
      .menu-item:nth-child(2) {
        animation-delay: 0.1s;
      }
      .menu-item:nth-child(3) {
        animation-delay: 0.15s;
      }
      .menu-item:nth-child(4) {
        animation-delay: 0.2s;
      }
      .menu-item:nth-child(5) {
        animation-delay: 0.25s;
      }
      .menu-item:nth-child(6) {
        animation-delay: 0.3s;
      }

      .item-photo {
        width: 120px;
        height: 115px;
        object-fit: cover;
        display: block;
      }

      .item-name {
        padding: 0 24px;
      }

      .item-name-text {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--brown-mid);
        line-height: 1.3;
      }

      .item-name-text.khmer {
        font-size: 22px;
        font-weight: 700;
      }

      .item-price {
        text-align: center;
        padding: 0 8px;
      }

      .price-amount {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: var(--brown-deep);
        display: block;
      }

      .price-symbol {
        font-size: 13px;
        font-weight: 500;
        color: var(--brown-light);
        margin-right: 1px;
      }

      /* Mobile responsive */
      @media (max-width: 600px) {
        .page {
          padding: 36px 16px 48px;
        }
        .page::before {
          inset: 10px;
        }
        .corner {
          width: 22px;
          height: 22px;
        }
        .corner-tl {
          top: 6px;
          left: 6px;
        }
        .corner-tr {
          top: 6px;
          right: 6px;
        }
        .corner-bl {
          bottom: 6px;
          left: 6px;
        }
        .corner-br {
          bottom: 6px;
          right: 6px;
        }
        .logo-img {
          width: 100% !important;
          height: 130px !important;
          object-fit: contain;
        }
        .bakery-name {
          font-size: 28px;
        }
        .tagline {
          font-size: 9px;
          letter-spacing: 2px;
        }
        .menu-title {
          font-size: 10px;
          letter-spacing: 3px;
        }
        .price-header {
          grid-template-columns: 80px 1fr 68px 68px;
          padding: 12px 6px;
        }
        .price-header span {
          font-size: 11px;
          letter-spacing: 0.5px;
        }
        .menu-item {
          grid-template-columns: 80px 1fr 68px 68px;
        }
        .item-photo {
          width: 80px;
          height: 80px;
        }
        .item-name {
          padding: 0 10px;
        }
        .item-name-text {
          font-size: 13px;
        }
        .item-name-text.khmer {
          font-size: 16px;
        }
        .price-amount {
          font-size: 13px;
        }
        .price-symbol {
          font-size: 10px;
        }
        .item-price {
          padding: 0 4px;
        }
        .footer-greeting {
          font-size: 14px;
        }
        .contact {
          font-size: 11px;
          letter-spacing: 1.5px;
        }
      }

      /* Footer */
      .footer {
        text-align: center;
        margin-top: 36px;
        position: relative;
        z-index: 1;
      }

      .footer-greeting {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        font-style: italic;
        color: var(--brown-mid);
      }

      .footer-heart {
        color: var(--gold);
        margin: 0 4px;
      }

      .contact {
        margin-top: 8px;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 2.5px;
        color: var(--brown-light);
        text-transform: uppercase;
      }

      .logo-img {
        width: 400px;
        height: 160px;
        object-fit: contain;
      }
    </style>
  </head>
